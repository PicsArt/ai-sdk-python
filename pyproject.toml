[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "picsart-ai-sdk"
version = "0.4.0"
description = "Python SDK for 100+ AI models — image, video, audio, and text generation with Picsart (parity with @picsart/ai-sdk)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Picsart" }]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "typing_extensions>=4.7",
]
keywords = ["ai", "sdk", "picsart", "image-generation", "video-generation", "audio-generation", "generative-ai"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Picsart/ai-sdk-python"
Documentation = "https://picsart.com/api-platform/docs"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/picsart_ai_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["src/picsart_ai_sdk/model_types.py"]  # generated by scripts/generate_model_types.py

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests", "scripts"]
