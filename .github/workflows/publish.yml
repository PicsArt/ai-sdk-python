# Publishes picsart-ai-sdk to public PyPI from the public mirror (github.com/PicsArt/ai-sdk-python).
#
# This file lives at .github/workflows/ in the source repo (GitLab) and is copied as-is by
# scripts/ci/mirror_to_github.py. Trigger: the vX.Y.Z tag the mirror job pushes.
#
# Auth: PyPI Trusted Publisher (OIDC) — no token stored. Configured once on pypi.org for project
# picsart-ai-sdk: owner PicsArt, repository ai-sdk-python, workflow publish.yml, environment pypi.
# Idempotent: a version already on PyPI is skipped, so re-runs are safe.

name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Tag must match the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$VERSION" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$VERSION"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/picsart-ai-sdk/
    permissions:
      id-token: write # OIDC Trusted Publishing (and attestations)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
